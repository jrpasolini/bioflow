<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#f6f9f9"/>
  <meta name="description" content="BioFlow — your health, your history, your control."/>
  <title>BioFlow | Laboratory history</title>
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('bioflow.theme'); } catch (_) {}
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = (stored === 'dark' || stored === 'light') ? stored : (systemDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      // English (US) is always the default unless the visitor selected Portuguese.
      var lang = null;
      try { lang = localStorage.getItem('bioflow.locale'); } catch (_) {}
      document.documentElement.lang = lang === 'pt-BR' ? 'pt-BR' : 'en-US';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0c1417' : '#f6f9f9');
    })();
  </script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
