# Temporary one-shot dependency-lock synchronization for Auth0 integration.
# Removed once the generated lockfile has been committed.
name: BioFlow Sync Auth0 Lockfile
on:
  push:
    branches:
      - bruna/single-entry-demo-code
permissions:
  contents: write
jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile with the official Auth0 SDK
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency resolution, if changed
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(auth0): lock official Auth0 SPA SDK dependencies"
            git push origin HEAD:bruna/single-entry-demo-code
          fi
