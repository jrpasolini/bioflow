name: BioFlow CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Switch to npm ci after generating and committing package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
