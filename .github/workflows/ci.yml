name: BioFlow CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build

      - run: npm run test:pwa
      - run: npm run build:check -w @bioflow/api
